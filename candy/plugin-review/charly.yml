plugin-review:
    candy:
        version: 2026.262.1709
        description: |-
            Read-only GitHub PR review for OpenCharly's gate: the deterministic
            verb:pr tools (pr_diff / pr_commits / pr_thread / pr_meta) plus
            command:review — the same chat-completions agent loop the retired
            pi-review-action ran: read-only GitHub tools delivered as SEPARATE
            messages (meta, body, diff, commits, a comment INDEX, and a
            per-comment read — so no single message is truncated and a long
            thread's tail stays reachable), a deterministic
            Verdict: PASS|BLOCK line, ONE PR comment, and $GITHUB_OUTPUT
            compatibility (response/success/verdict). Also serves the runtime
            orchestration executor (charly review --plan <path>) that turns a
            declared review-plan.yml into a step pipeline, so ANY runtime plugin
            can join the review workflow purely through config. The review
            rulebook is a 1:1 port of pi-review-action's prompt.txt, resolved at
            run time via REVIEW_PROMPT_PATH (T1: instructions from main, never
            the PR under review).
        plugin:
            providers:
                - verb:pr
                - command:review
            source: github.com/opencharly/plugin-review/candy/plugin-review
        require:
            - '@github.com/opencharly/layer-gh:v2026.239.1624'
        plan:
            - # ADE check: deterministic build-context check that the module the host
              # must build + connect ships (go.mod + provider). The full review loop
              # (tools -> LLM tool-loop -> verdict -> comment) is exercised by the Go
              # e2e (e2e_test.go) + the live R10.
              check: the out-of-tree plugin-review candy ships a buildable Go module (go.mod + provider main) the host can build + connect; the full review engine is exercised by the Go e2e + the live R10
              id: plugin-review-module-present
              context:
                - build
              command: "test -f go.mod && test -f plugin.go"

review-skill:
    skill:
        name: review
        family: review
        owner: plugin-review
        description: |-
            The `charly review` read-only GitHub PR review engine — the chat-completions review
            loop, verb:pr tools, a deterministic Verdict: PASS|BLOCK. Use to review a PR or run a
            declared review plan.
        triggers:
            - "`charly review` / review a PR / PR verdict / review plan"
        content: |
            # charly review — read-only GitHub PR review

            `charly review` is OpenCharly's gate reviewer. Served by `candy/plugin-review`
            (`command:review`, out-of-process over gRPC).

            ## What it provides

            - the deterministic `verb:pr` tools — `pr_diff`, `pr_commits`, `pr_thread`, `pr_meta`;
            - `command:review` — the same chat-completions agent loop the retired
              `pi-review-action` ran: read-only GitHub tools delivered as SEPARATE messages
              (meta, body, diff, commits, a comment INDEX, and a per-comment read — so a long
              thread's newest comments stay reachable and nothing is lost to a message cap), a
              deterministic `Verdict: PASS|BLOCK` line, ONE PR comment, and `$GITHUB_OUTPUT`
              compatibility (`response`/`success`/`verdict`);
            - the runtime orchestration executor (`charly review --plan <path>`) that turns a
              declared `review-plan.yml` into a step pipeline, so any runtime plugin can join the
              review workflow purely through config.

            The review rulebook is a 1:1 port of `pi-review-action`'s `prompt.txt`, resolved at
            run time via `REVIEW_PROMPT_PATH` (instructions come from `main`, never the PR).

            ## When to use it

            To review a PR (the `charly/pr-validator` gate) or to author a custom review plan.

            ## Cross-References

            - `/charly-internals:git-workflow` — the PR-only landing + validator gate.
            - `/charly-pipeline:pipeline` — the runtime the plan executor builds on.
