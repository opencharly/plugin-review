name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: gofmt/vet/test (incl. the full-loop e2e)
        working-directory: candy/plugin-review
        run: |
          gofmt -l . | grep -v '^$' && exit 1 || true
          go vet ./...
          go test ./...
      - name: Generated params are reproducible (cue:gen)
        run: |
          mkdir -p /tmp/cuegen && cp candy/plugin-review/schema/review.cue /tmp/cuegen/
          printf 'package params\n' > /tmp/cuegen/review.cue.prefix
          cat /tmp/cuegen/review.cue.prefix candy/plugin-review/schema/review.cue > /tmp/cuegen/wrapped.cue
          cd /tmp/cuegen && cue exp gengotypes . -o candygen.go
          cd $GITHUB_WORKSPACE && diff <(sed '1,2d' /tmp/cuegen/candygen.go) <(sed '1,2d' candy/plugin-review/params/cue_types_gen.go)
